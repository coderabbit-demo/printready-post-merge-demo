<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrintReady — instant 3D-printing quotes</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #17202a;
        background: #f3f1eb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(circle at 15% 20%, #f9a82633, transparent 24rem),
          radial-gradient(circle at 90% 80%, #42b7a933, transparent 26rem),
          #f3f1eb;
      }

      main {
        width: min(920px, 100%);
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        overflow: hidden;
        border: 1px solid #17202a1f;
        border-radius: 28px;
        background: #fff;
        box-shadow: 0 28px 80px #17202a1a;
      }

      .intro {
        padding: 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #17202a;
        color: #fff;
      }

      .brand { font-weight: 800; letter-spacing: -0.03em; }
      .brand span { color: #f9a826; }

      h1 {
        margin: 56px 0 16px;
        font-size: clamp(42px, 6vw, 68px);
        line-height: 0.98;
        letter-spacing: -0.06em;
      }

      .intro p {
        max-width: 32rem;
        margin: 0;
        color: #d9dfdf;
        font-size: 18px;
        line-height: 1.55;
      }

      .promise {
        margin-top: 48px;
        color: #f9a826;
        font-size: 14px;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .quote { padding: 52px; }
      .quote h2 { margin: 0 0 30px; font-size: 24px; }

      label, legend {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      select {
        width: 100%;
        margin-bottom: 22px;
        padding: 14px 16px;
        border: 1px solid #cfd6d4;
        border-radius: 12px;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      fieldset {
        margin: 4px 0 26px;
        padding: 0;
        border: 0;
      }

      .rush-option {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px;
        border: 1px solid #f9a826;
        border-radius: 14px;
        background: #fff9ec;
        cursor: pointer;
        text-transform: none;
        letter-spacing: 0;
      }

      .rush-option input { width: 18px; height: 18px; accent-color: #e88e05; }
      .rush-option strong { display: block; }
      .rush-option small { color: #66706f; font-weight: 500; }

      .result {
        min-height: 142px;
        margin-top: 4px;
        padding: 22px;
        border-radius: 18px;
        background: #ecf7f5;
      }

      .result .eyebrow {
        margin: 0 0 4px;
        color: #347f75;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .price { margin: 0; font-size: 42px; font-weight: 850; letter-spacing: -0.05em; }
      .turnaround { margin: 4px 0 0; color: #52615f; }
      .savings { margin: 10px 0 0; color: #347f75; font-size: 14px; font-weight: 750; }
      .unavailable { background: #fff1ed; }
      .unavailable .eyebrow { color: #a6472f; }
      .unavailable .price { font-size: 20px; letter-spacing: -0.02em; }

      @media (max-width: 720px) {
        body { padding: 16px; }
        main { grid-template-columns: 1fr; }
        .intro, .quote { padding: 36px; }
        h1 { margin-top: 36px; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro">
        <div>
          <div class="brand">Print<span>Ready</span></div>
          <h1>Ideas, made faster.</h1>
          <p>Choose your design and material. Get a clear price and delivery estimate in seconds.</p>
        </div>
        <div class="promise">Now offering 24-hour rush printing</div>
      </section>

      <section class="quote" aria-labelledby="quote-heading">
        <h2 id="quote-heading">Build your quote</h2>

        <label for="design">Design</label>
        <select id="design">
          <option value="phone-stand">Phone stand</option>
          <option value="cable-organizer">Cable organizer</option>
          <option value="desk-planter">Desk planter</option>
        </select>

        <label for="material">Material</label>
        <select id="material">
          <option value="pla">PLA — everyday</option>
          <option value="petg">PETG — extra durable</option>
        </select>

        <label for="quantity">Quantity</label>
        <select id="quantity">
          <option value="1">1 item</option>
          <option value="5">5 items — save 5%</option>
          <option value="10">10 items — save 10%</option>
          <option value="25">25 items — save 15%</option>
        </select>

        <fieldset>
          <legend>Delivery</legend>
          <label class="rush-option" for="rush">
            <input id="rush" type="checkbox" checked />
            <span><strong>Rush printing</strong><small>Ready within 24 hours · 30% surcharge</small></span>
          </label>
        </fieldset>

        <div class="result" id="result" role="status" aria-live="polite"></div>
      </section>
    </main>

    <script type="module">
      import { calculateQuote } from "./quote.mjs";

      const design = document.querySelector("#design");
      const material = document.querySelector("#material");
      const quantity = document.querySelector("#quantity");
      const rush = document.querySelector("#rush");
      const result = document.querySelector("#result");

      function updateQuote() {
        const quote = calculateQuote({
          design: design.value,
          material: material.value,
          quantity: quantity.value,
          rush: rush.checked,
        });

        result.classList.toggle("unavailable", !quote.available);
        result.innerHTML = quote.available
          ? `<p class="eyebrow">Estimated total · ${quote.quantity} ${quote.quantity === 1 ? "item" : "items"}</p><p class="price">$${quote.total.toFixed(2)}</p><p class="turnaround">${quote.turnaround}</p>${quote.savings > 0 ? `<p class="savings">Volume savings: $${quote.savings.toFixed(2)} (${quote.discountRate * 100}% off)</p>` : ""}`
          : `<p class="eyebrow">Standard delivery only</p><p class="price">${quote.message}</p><p class="turnaround">Choose another design or turn off rush printing.</p>`;
      }

      [design, material, quantity, rush].forEach((control) => control.addEventListener("change", updateQuote));
      updateQuote();
    </script>
  </body>
</html>
