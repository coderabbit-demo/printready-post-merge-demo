# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true

reviews:
  post_merge_actions:
    - name: "Document customer-facing changes"
      enabled: true
      prompt: |
        Review the PR title, description, summary, and merged diff. Apply this
        action only when the PR introduces or materially changes a customer-facing
        functionality, behavior, pricing, eligibility, or service commitments.
        Do nothing for internal refactors, tests, dependency updates,
        documentation-only changes, or changes without meaningful customer impact.

        Update only CHANGELOG.md. Under the "Unreleased" heading, add exactly one
        bullet at the top of the existing list using this format:
        - **<short feature name>** — <plain-language customer benefit or behavior change> ([#<PR number>](<PR URL>))

        Keep the complete bullet under 40 words. Describe what customers can now
        do or experience, not implementation details. Do not speculate or include
        claims unsupported by the merged change.

        If CHANGELOG.md already contains an entry linking to this PR, do nothing.
        Preserve all existing content and formatting. Do not modify any other file.
